# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network identity
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string lan

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account setup
d-i passwd/root-login boolean false
d-i passwd/user-fullname string user
d-i passwd/username string user
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i user-setup/allow-password-weak boolean true

# Time
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Partitioning: GPT + EFI partition + single Btrfs root partition
# EFI partition is required for UEFI boot. Root is a single Btrfs partition.
d-i partman/early_command string \
    mkdir -p /var/log/installer 2>/dev/null || true; \
    log=/var/log/installer/auto-disk-select.log; \
    : > "$log" 2>/dev/null || log=/tmp/auto-disk-select.log; \
    : > "$log" 2>/dev/null || true; \
    log_msg() { printf '%s\n' "$$1" >> "$log" 2>/dev/null || true; }; \
    log_msg "auto disk selection started"; \
    candidates=""; \
    for d in $(list-devices disk); do \
      base="${d##*/}"; \
      rem_file="/sys/block/$base/removable"; \
      if [ -r "$rem_file" ] && [ "$(cat "$rem_file")" != 0 ]; then \
        log_msg "skip removable $d"; \
        continue; \
      fi; \
      if readlink -f "/sys/block/$base" 2>/dev/null | grep -qi "/usb"; then \
        log_msg "skip usb-attached $d"; \
        continue; \
      fi; \
      size_file="/sys/block/$base/size"; \
      size=0; \
      if [ -r "$size_file" ]; then size="$(cat "$size_file" 2>/dev/null || echo 0)"; fi; \
      log_msg "candidate $d size=$size"; \
      candidates="$candidates $d:$size"; \
    done; \
    target=""; \
    max_size=-1; \
    for entry in $candidates; do \
      dev="${entry%%:*}"; \
      size="${entry##*:}"; \
      if [ "$size" -gt "$max_size" ] 2>/dev/null; then \
        target="$dev"; \
        max_size="$size"; \
      fi; \
    done; \
    if [ -z "$target" ]; then \
      target="$(list-devices disk | head -n1)"; \
      log_msg "WARNING: no non-removable non-USB candidate; fallback to $target"; \
    fi; \
    log_msg "selected target=$target size=$max_size"; \
    debconf-set partman-auto/disk "$target"; \
    debconf-set grub-installer/bootdev "$target"
d-i partman-partitioning/default_label string gpt
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select btrfs-root
d-i partman-auto/expert_recipe string                         \
      btrfs-root ::                                           \
              538 538 1075 free                               \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi } format{ }                 \
              .                                               \
              4096 10000 -1 btrfs                             \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ btrfs }   \
                      mountpoint{ / }                         \
              .
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-basicfilesystems/no_swap boolean false
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base packages and bootloader
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server btrfs-progs snapper sudo
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Enable Btrfs snapshot tooling
d-i preseed/late_command string \
    in-target sh -euxc ' \
      exec > /root/preseed-late.log 2>&1; \
      command -v snapper; \
      command -v btrfs; \
      command -v systemctl; \
      test "$(findmnt -n -o FSTYPE /)" = "btrfs"; \
      snapper --no-dbus -c root create-config /; \
      systemctl enable snapper-timeline.timer; \
      systemctl enable snapper-cleanup.timer; \
      usermod -aG sudo user; \
      mkdir -p /home/user/.ssh; \
      chmod 700 /home/user/.ssh; \
      chown user:user /home/user/.ssh; \
      if [ -s /cdrom/authorized_key.pub ]; then \
        cp /cdrom/authorized_key.pub /home/user/.ssh/authorized_keys; \
        chmod 600 /home/user/.ssh/authorized_keys; \
        chown user:user /home/user/.ssh/authorized_keys; \
      else \
        echo "WARNING: /cdrom/authorized_key.pub missing or empty; skipping SSH key install"; \
      fi; \
      snapper --no-dbus -c root create --description Initial-install; \
      snapper --no-dbus list-configs | grep -Eq "^root[[:space:]]" \
    '

# Finish
d-i finish-install/reboot_in_progress note
